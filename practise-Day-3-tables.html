<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Setting Up Tables</title>
  </head>
  <body>
    <h1>Module Day 3</h1>
    <table>
        <tr>
                <thead>
                <th>Name</th>
                <th>Age</th>    
                <th>City</th>
                </thead>
            <tbody>
            <tr>
                <td>Katlego</td>
                <td>24</td>
                <td>Johannesburg</td>    
            </tr>
            </tbody>
            <tbody>
                <tr>
                    <td>Lindokuhle</td>
                    <td>25</td>
                    <td>Katlehong</td>
                </tr>
            </tbody>
        </tr>
    </table>
    <section>   
    <form action="#" method="POST">
        style="border"
        <label for="firstname">First Name</label><br>
        <input type="text" id="firstname" placeholder="Enter Your First Name"
         required><br><br>

         <label for="lastname">Last Name:</label><br>
         <input type="text" id="lastname" placeholder="Enter Your Last Name" required><br><br>


         <label for="Email">Email:</label><br>
         <input type="Email" placeholder="Enter Your Email" required><br><br>

         <label for="age">Age</label><br>
         <input type="number" id="age" minlength="0" maxlength="100"><br><br>

         <label for="phone">Phone Number</label><br>
         <input type="tel" id="phone" minlength="10" maxlength="10">

         <br><br>


         <label for="password">Password</label><br>
         <input type="password" id="password">
         <br><br>

         
         <label for="dob">Date off Birth</label><br>
         <input type="date" id="dob"><br><br>

         <label for="province">Province</label><br>
         <select id="province">
         <option>Western Cape</option>
         <option>Gauteng</option>
         <option>Free State</option>
         </select>
         <br><br>

         <p>Gender</p>
         <input type="radio" id="gender">
         <label for="male">Male</label>
         <input type="radio" id="male" name="gender">

         <label for="female">Female</label>
         <input type="radio" id="female" name="gender">



         <p>Programming Language</p>
         <input type="checkbox" id="html" name="Language">
         <label for="html">HTML</label><BR><BR>
        
        <input type="checkbox" id="css" name="Language">
        <label for="css">CSS</label><br><br>   

        <button type="reset">Reset</button>
         <button type="submit">Submit</button>



    </form>
    </section>

    

  </body>
</html>
